<!DOCTYPE html>
<html lang="it">

<head>
    <link rel="manifest" href="{{ site.baseurl }}/manifest.json">
    <meta name="theme-color" content="#A0293B">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/Calice/service-worker.js');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} — Calice</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HW7E04GJP3"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-HW7E04GJP3');
    </script>
    <style>
        :root {
            --wine: #A0293B;
            --wine-light: #C4495E;
            --wine-pale: #F9EDEF;
            --terra: #C4693A;
            --ink: #1A1A2E;
            --gray: #6B6B7E;
            --silver: #E8E8F0;
            --bg: #FAFAF8;
            --white: #FFFFFF;
            --gold: #B8860B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--ink);
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--white);
            border-bottom: 1px solid var(--silver);
            padding: 0 48px;
            display: flex;
            align-items: center;
            gap: 40px;
            height: 64px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--ink);
            text-decoration: none;
        }

        .logo span {
            color: var(--wine);
            font-style: italic;
        }

        .back-btn {
            margin-left: auto;
            border: 1.5px solid var(--silver);
            background: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--gray);
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
            text-decoration: none;
            transition: all 0.2s;
        }

        .back-btn:hover {
            border-color: var(--wine);
            color: var(--wine);
        }

        .article-hero {
            background: var(--ink);
            color: var(--white);
            padding: 80px 80px 64px;
            position: relative;
            overflow: hidden;
        }

        .article-hero::before {
            content: '{{ page.emoji }}';
            font-size: 300px;
            position: absolute;
            right: -40px;
            top: -40px;
            opacity: 0.05;
            line-height: 1;
        }

        .article-tag {
            display: inline-block;
            background: var(--wine);
            color: var(--white);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 6px;
            margin-bottom: 24px;
        }

        .article-hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 56px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 20px;
            max-width: 700px;
        }

        .article-hero h1 em {
            color: var(--wine-light);
            font-style: italic;
        }

        .article-meta {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        .article-meta strong {
            color: rgba(255, 255, 255, 0.8);
        }

        .article-body {
            max-width: 780px;
            margin: 0 auto;
            padding: 64px 48px;
            font-size: 16px;
            line-height: 1.85;
            color: var(--gray);
        }

        .article-body h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--ink);
            margin: 48px 0 16px;
        }

        .article-body h3 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--ink);
            margin: 32px 0 12px;
        }

        .article-body p {
            margin-bottom: 20px;
        }

        .article-body strong {
            color: var(--ink);
        }

        .article-body em {
            font-style: italic;
        }

        .article-body blockquote {
            background: var(--wine-pale);
            border-left: 4px solid var(--wine);
            padding: 24px 28px;
            border-radius: 0 12px 12px 0;
            margin: 32px 0;
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-style: italic;
            color: var(--wine);
        }

        .article-cta {
            background: var(--ink);
            color: var(--white);
            border-radius: 20px;
            padding: 48px;
            text-align: center;
            margin-top: 64px;
        }

        .article-cta h3 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .article-cta p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 28px;
        }

        .btn-cta {
            display: inline-block;
            background: var(--wine);
            color: var(--white);
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-cta:hover {
            background: var(--wine-light);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            nav {
                padding: 0 24px;
            }

            .article-hero {
                padding: 48px 24px 40px;
            }

            .article-hero h1 {
                font-size: 36px;
            }

            .article-body {
                padding: 40px 24px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="{{ site.baseurl }}/" class="logo">Ca<span>lice</span></a>
        <a href="{{ site.baseurl }}/" class="back-btn">← Torna ai vini</a>
    </nav>

    <div class="article-hero">
        <div class="article-tag">{{ page.tag }}</div>
        <h1>{{ page.title }}</h1>
        <div class="article-meta">
            <strong>{{ page.autore }}</strong> · {{ page.data }}
        </div>
    </div>

    <div class="article-body">
        {{ content }}

        <div class="article-cta">
            <h3>Scopri i vini di Calice</h3>
            <p>Esplora il catalogo e condividi le tue degustazioni.</p>
            <a href="{{ site.baseurl }}/" class="btn-cta">🍷 Esplora il catalogo</a>
        </div>
    </div>

</body>

</html>
