url: "https://barcolana.github.io"
baseurl: "/Calice"

plugins:
  - jekyll-sitemap

collections:
  vini:
    output: true
    permalink: /vini/:name/
  articoli:
    output: true
    permalink: /blog/:name/

defaults:
  - scope:
      path: ""
      type: "vini"
    values:
      layout: vino
  - scope:
      path: ""
      type: "articoli"
    values:
      layout: articolo